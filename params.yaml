# ethereum-package params — DRAFT, BELUM DIJALANKAN
# =================================================
# Devnet minimal untuk mengamati boundary fork Fulu -> Gloas
# dengan ethereum-package (1 participant, geth + Lighthouse).
# Dibuat 12 Nov 2026 sebagai PENYIAPAN — TIDAK PERNAH dieksekusi di VM ini
# (VM tidak bisa jalanin Docker/Kurtosis: RAM tersedia ~578 MiB, lihat
# CATATAN.md). Jangan dikutip sebagai hasil.
#
# SEBELUM `kurtosis run` di mesin yang mampu, VERIFIKASI:
#   1. Nama kunci fork-epoch di `network_params` sesuai versi ethereum-package
#      yang dipakai (cek schema `network_params` di repo
#      ethpandaops/ethereum-package versi itu — kunci berubah antar versi).
#   2. Tag image client HARUS yang mendukung Gloas (mis. dari tabel rilis
#      Sepolia: Lighthouse 8.3.0-rc.0 / Prysm 7.2.0 / Teku 26.9.1,
#      geth 1.17.7, atau lebih baru). Image lama tanpa Gloas tidak akan
#      mencapai fork.
#   3. `validator_count`: cukup untuk finalisasi. Satu participant dengan
#      sedikit validator tetap bisa finalisasi (quorum internal), tapi pakai
#      nilai default package bila ragu.
#
# Cara pakai (mesin yang mampu, lihat RUNBOOK.md):
#   kurtosis run github.com/ethpandaops/ethereum-package "$(cat params.yaml)"

participants:
  - el_type: geth
    cl_type: lighthouse
    # el_image / cl_image: isi tag Gloas-capable secara eksplisit di run time
    # (contoh pola: ethpandaops/geth:<versi-gloas>, ethpandaops/lighthouse:<versi-gloas>)
    # validator_count HARUS >= 128: Fulu aktif (epoch 1) mengharuskan minimal
    # satu node punya 128+ validator ATAU supernode ATAU perfect_peerdas
    # (input_parser.star ~l.694; run #43160382328 gagal tanpa ini).
    # 128 kunci di satu node itu murah (cuma kunci BLS, bukan kontainer baru).
    validator_count: 128
    count: 1

network_params:
  network: kurtosis
  # Genesis di Fulu, fork Gloas cepat (epoch kecil) supaya boundary
  # cepat tercapai dan mudah diamati. Epoch 0 = genesis; epoch 1 = Fulu;
  # sesuaikan angka persisnya dengan schema package yang dipakai.
  electra_fork_epoch: 0
  fulu_fork_epoch: 1
  gloas_fork_epoch: 2
  # BPO: fulu != 0 (genesis) requires every bpo_*_epoch >= fulu_fork_epoch
  # (input_parser.star fails otherwise). bpo_3/4/5 default to FAR_FUTURE,
  # which is already >= 1, so only 1 and 2 need setting here.
  bpo_1_epoch: 1
  bpo_2_epoch: 1
  # amsterdam_fork_epoch: isi sesuai schema package (EL half Glamsterdam).
  # Kunci di atas bertipe epoch; bila schema package memakai timestamp
  # (mis. *_fork_time), konversi ke waktu genesis + epoch*384 detik.
  seconds_per_slot: 12

# Observasi yang dicari di boundary (epoch 2):
#   - Apakah blok Gloas pertama ter-build, ter-propagasi, ter-finalisasi?
#   - Log CL di sekitar slot pertama epoch 2 (error / reorg / finalisasi).
#   - Snapshot API beacon: /eth/v1/beacon/headers + finality_checkpoints.
# Analisis detail bersifat privat dan tidak ada di repo ini.
